[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-report"
version = "0.1.0"
description = "日报/周报/月报记录与总结工具，支持 OpenAI 协议模型与关键词检索"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "PyYAML>=6.0",
    "python-dateutil>=2.8.2",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
daily-report = "daily_report.cli:main"
daily-report-gui = "daily_report.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daily_report = ["assets/*"]
